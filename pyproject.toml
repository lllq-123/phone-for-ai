[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "phone-for-ai"
version = "0.1.2"
description = "A self-hosted bridge and stdio MCP for one Android phone"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "mcp>=1.8,<2",
  "starlette>=0.37,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
phone-for-ai = "phone_for_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phone_for_ai"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "phone_for_ai/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
